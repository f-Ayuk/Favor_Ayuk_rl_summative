[project]
name = "smart-irrigation-rl"
version = "1.0.0"
description = "Comparative RL for Smart Irrigation"
requires-python = ">=3.11,<3.13"
dependencies = [
    "gymnasium>=1.0",
    "torch>=2.5",
    "torchrl>=0.6",
    "tensordict>=0.6",
    "numpy",
    "pandas",
    "matplotlib",
    "seaborn",
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pygame",
    "tensorboard",
    "pytest"
]

[tool.uv]
package = false